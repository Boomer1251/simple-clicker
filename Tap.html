<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1c1a;--mut:#85837b;--card:#ffffff;--line:#e3e1d8;--acc:#e8590c;--gold:#f0b400;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#efede6;--mut:#8b897f;--card:#1e1e1c;--line:#2e2e2b;--acc:#ff7a33;--gold:#ffc61a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--fg:#efede6;--mut:#8b897f;--card:#1e1e1c;--line:#2e2e2b;--acc:#ff7a33;--gold:#ffc61a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:420px;margin:0 auto;padding:28px 16px 60px;text-align:center;user-select:none;-webkit-user-select:none}
#score{font-size:56px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#rate{color:var(--mut);font-size:14px;min-height:20px}
#tap{width:190px;height:190px;border-radius:50%;border:0;margin:26px 0 10px;background:var(--acc);box-shadow:0 8px 0 color-mix(in srgb,var(--acc) 65%,#000);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
#tap:active{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--acc) 65%,#000)}
#info{min-height:22px;font-size:14px;color:var(--mut);margin-bottom:18px}
#info b{color:var(--acc)}
#shop{display:flex;flex-direction:column;gap:8px;text-align:left}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.it small{display:block;color:var(--mut);font-size:12px}
.it .c{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.it.no{opacity:.45;cursor:default}
.it.up{border-color:var(--acc)}
.it.as{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
#foot{margin-top:22px;font-size:12px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.fl{position:fixed;pointer-events:none;font-weight:700;color:var(--acc);animation:fl .8s ease-out forwards;z-index:5}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
#orb{position:fixed;width:64px;height:64px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#fff7c2,var(--gold) 60%);box-shadow:0 0 24px var(--gold);animation:pu 1s ease-in-out infinite;z-index:6;cursor:pointer}
@keyframes pu{50%{transform:scale(1.18)}}
</style></head><body>
<main>
<div id="score">0</div><div id="rate"></div>
<button id="tap" aria-label="Tap"></button>
<div id="info"></div>
<div id="shop"></div>
<div id="foot"></div>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const G=[["Tap bot",15,.2],["Hand",100,1],["Drone",1100,8],["Reactor",12000,47],["Portal",130000,260],["Star",1.4e6,1400],["Galaxy",2e7,7800]];
const fresh=()=>({p:0,t:0,k:0,n:G.map(()=>0),u:{},sh:0,asc:0,a:{},ts:Date.now(),fx:{f:0,c:0}});
let s=fresh(),away=0;
try{const r=JSON.parse(localStorage.getItem('clk1'));if(r&&r.n&&r.n.length===G.length)s=Object.assign(fresh(),r)}catch(e){}
const has=id=>s.u[id];
const U=[];
for(let k=0;k<6;k++)U.push({id:'c'+k,n:'Sharper taps',d:'Taps ×2',c:100*8**k,v:()=>s.t>=100*8**k/3});
for(let k=0;k<3;k++)U.push({id:'e'+k,n:'Echo',d:'Each tap also adds 2% of your per-second',c:5000*20**k,v:()=>s.t>=5000*20**k/3});
for(let k=0;k<3;k++)U.push({id:'r'+k,n:'Rhythm',d:'Max combo +1',c:2000*10**k,v:()=>s.t>=2000*10**k/3});
G.forEach((g,i)=>[10,25,50].forEach((th,j)=>U.push({id:'t'+i+j,n:g[0]+' boost',d:g[0]+' output ×2',c:g[1]*[10,100,1000][j],v:()=>s.n[i]>=th})));
U.push({id:'l',n:'Lure',d:'Golden orbs appear twice as often',c:50000,v:()=>s.t>=20000});
const tm=i=>[0,1,2].reduce((m,j)=>has('t'+i+j)?m*2:m,1);
const pm=()=>1+.1*s.sh;
const fon=k=>Date.now()<s.fx[k];
const cps=()=>G.reduce((x,g,i)=>x+s.n[i]*g[2]*tm(i),0)*pm()*(fon('f')?7:1);
const cmax=()=>2+[0,1,2].filter(k=>has('r'+k)).length;
const cost=i=>Math.ceil(G[i][1]*1.15**s.n[i]);
function f(n){if(n<1e3)return n<10?(Math.round(n*10)/10)+'':Math.floor(n)+'';const S=['K','M','B','T','Qa','Qi','Sx'];let i=-1;while(n>=1e3&&i<S.length-1){n/=1e3;i++}return n.toFixed(n<10?2:n<100?1:0)+S[i]}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2600)}
let cm=1,last=0;
function tapVal(){let m=1;for(let k=0;k<6;k++)if(has('c'+k))m*=2;let e=0;for(let k=0;k<3;k++)if(has('e'+k))e+=.02;return(m*pm()*(fon('c')?20:1)+e*cps())*cm}
function tap(x,y){cm=Math.min(cmax(),cm+.06);last=Date.now();const v=tapVal();s.p+=v;s.t+=v;s.k++;
const d=document.createElement('div');d.className='fl';d.textContent='+'+f(v);d.style.left=(x-14)+'px';d.style.top=(y-20)+'px';document.body.appendChild(d);d.onanimationend=()=>d.remove()}
$('tap').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button)return;tap(e.clientX,e.clientY)});
$('tap').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat){const r=$('tap').getBoundingClientRect();tap(r.left+r.width/2,r.top+r.height/2)}}});
const ascGain=()=>Math.floor(Math.sqrt(s.t/1e6));
let ascArm=0;
function buy(k){
if(k[0]==='g'){const i=+k.slice(1),c=cost(i);if(s.p>=c){s.p-=c;s.n[i]++}}
else if(k[0]==='u'){const u=U.find(x=>x.id===k.slice(2));if(u&&!has(u.id)&&s.p>=u.c){s.p-=u.c;s.u[u.id]=1}}
else if(k==='asc'){if(Date.now()>ascArm){ascArm=Date.now()+3000;sig='';return}
const g=ascGain();if(g<1)return;const keep={sh:s.sh+g,asc:s.asc+1,a:s.a,k:s.k};s=Object.assign(fresh(),keep);cm=1;toast('Ascended. Production is now +'+Math.round(s.sh*10)+'%')}
sig='';save()}
$('shop').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&!b.classList.contains('no'))buy(b.dataset.k)});
let sig='';
function shop(){
const items=[];
G.forEach((g,i)=>{if(s.n[i]>0||s.t>=g[1]*.5||(i>0&&s.n[i-1]>2&&s.t>=g[1]*.2))items.push({k:'g'+i,c:cost(i),n:s.n[i],h:`<span>${g[0]} <b>${s.n[i]}</b><small>+${f(g[2]*tm(i)*pm())}/s each</small></span>`,cl:''})});
U.filter(u=>!has(u.id)&&u.v()).sort((a,b)=>a.c-b.c).slice(0,3).forEach(u=>items.push({k:'u:'+u.id,c:u.c,n:0,h:`<span>${u.n}<small>${u.d}</small></span>`,cl:'up'}));
const ag=ascGain();
const arm=Date.now()<ascArm;
let out='',sg='';
items.forEach(it=>{const can=s.p>=it.c;sg+=it.k+it.n+can;out+=`<button class="it ${it.cl} ${can?'':'no'}" data-k="${it.k}">${it.h}<span class="c">${f(it.c)}</span></button>`});
if(ag>=1){sg+='A'+ag+arm;out+=`<button class="it as" data-k="asc"><span>${arm?'Tap again to confirm':'Ascend'}<small>Reset this run for +${ag*10}% production forever</small></span><span class="c">+${ag}</span></button>`}
if(sg!==sig){sig=sg;$('shop').innerHTML=out}}
const A=[[()=>s.k>=1,'First tap'],[()=>s.k>=100,'100 taps'],[()=>s.k>=1000,'1,000 taps'],[()=>s.n.some(x=>x>0),'Something works for you now'],[()=>s.n.every(x=>x>0),'One of everything'],[()=>s.t>=1e6,'A million'],[()=>s.asc>=1,'Ascended'],[()=>cm>=4.99,'Max rhythm']];
let orb=null,nextOrb=Date.now()+30000;
function spawnOrb(){const o=document.createElement('button');o.id='orb';o.setAttribute('aria-label','Golden orb');o.style.left=(8+Math.random()*(innerWidth-80))+'px';o.style.top=(80+Math.random()*(innerHeight-200))+'px';
o.addEventListener('pointerdown',()=>{const r=Math.random(),n=Date.now();
if(r<.4){s.fx.f=n+15000;toast('Frenzy. Production ×7 for 15s')}
else if(r<.7){const g=cps()*300+20;s.p+=g;s.t+=g;toast('Lucky. +'+f(g))}
else{s.fx.c=n+12000;toast('Tap frenzy. Taps ×20 for 12s')}
o.remove();orb=null});
document.body.appendChild(o);orb=o;setTimeout(()=>{if(orb===o){o.remove();orb=null}},12000)}
let lt=Date.now();
function tick(){const n=Date.now(),dt=Math.min((n-lt)/1000,1);lt=n;
const g=cps()*dt;s.p+=g;s.t+=g;
if(n-last>700)cm=Math.max(1,cm-dt*1.5);
if(!orb&&n>nextOrb){spawnOrb();nextOrb=n+(40+Math.random()*60)*1000*(has('l')?.5:1)}
A.forEach((a,i)=>{if(!s.a[i]&&a[0]()){s.a[i]=1;toast('★ '+a[1])}});
$('score').textContent=f(s.p);
$('rate').textContent=s.t>0?f(cps())+' per second':'';
let inf=[];if(cm>1.05)inf.push('combo <b>×'+cm.toFixed(1)+'</b>');
if(fon('f'))inf.push('<b>frenzy</b> '+Math.ceil((s.fx.f-n)/1000)+'s');
if(fon('c'))inf.push('<b>tap frenzy</b> '+Math.ceil((s.fx.c-n)/1000)+'s');
$('info').innerHTML=inf.join(' · ');
$('foot').textContent=(s.t>0?'★ '+Object.keys(s.a).length+'/'+A.length:'')+(s.sh?' · ascensions '+s.asc+' · bonus +'+Math.round(s.sh*10)+'%':'');
shop()}
function save(){try{s.ts=Date.now();localStorage.setItem('clk1',JSON.stringify(s))}catch(e){}}
if(s.ts&&s.t>0){const a=Math.min((Date.now()-s.ts)/1000,3600),g=cps()*a*.5;if(g>1){s.p+=g;s.t+=g;setTimeout(()=>toast('While you were away: +'+f(g)),400)}}
setInterval(tick,100);setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
tick();
</script></body></html>
